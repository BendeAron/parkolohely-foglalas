version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: parkolo_db_container
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkolo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkolo_backend_container
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-parkolo_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-postgrespassword}
      APP_DEBUG: ${APP_DEBUG:-true}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkolo_frontend_container
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend
    depends_on:
      - backend

volumes:
  pgdata: